<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Track your Pickar delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #8B1538;
    --primary-soft: #F6E9ED;
    --bg: #FEFAFA;
    --surface: #FFFFFF;
    --text-primary: #1F2937;
    --text-secondary: #6B7280;
    --border: #E5E7EB;
    --success: #16A34A;
    --success-soft: #E8F6ED;
    --error: #EF4444;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Poppins', sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────── */
  .brand-bar {
    padding: 20px 24px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-mark {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 13px;
  }
  .brand-name {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--text-primary);
  }

  /* ── Status hero ────────────────────────────────────── */
  .hero {
    padding: 8px 24px 28px;
  }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 0 0 6px;
  }
  .status-headline {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.25;
    margin: 0;
  }
  .status-sub {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 6px 0 0;
  }

  /* ── Timeline (the signature element) ──────────────────
     A vertical rail that fills with the wine accent as the
     delivery progresses, with a pulsing dot on the live stage. */
  .timeline {
    padding: 4px 24px 8px;
    position: relative;
  }
  .stage {
    position: relative;
    padding: 0 0 28px 32px;
  }
  .stage:last-child { padding-bottom: 0; }
  .stage-rail {
    position: absolute;
    left: 9px;
    top: 22px;
    bottom: -6px;
    width: 2px;
    background: var(--border);
  }
  .stage:last-child .stage-rail { display: none; }
  .stage.done .stage-rail { background: var(--primary); }

  .stage-dot {
    position: absolute;
    left: 0;
    top: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }
  .stage.done .stage-dot {
    background: var(--primary);
    border-color: var(--primary);
  }
  .stage.done .stage-dot::after {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: white;
  }
  .stage.active .stage-dot {
    border-color: var(--primary);
    background: var(--primary-soft);
  }
  .stage.active .stage-dot::after {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(139, 21, 56, 0.45); }
    70%  { box-shadow: 0 0 0 9px rgba(139, 21, 56, 0); }
    100% { box-shadow: 0 0 0 0 rgba(139, 21, 56, 0); }
  }

  .stage-label {
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .stage.done .stage-label,
  .stage.active .stage-label {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* ── Cards ──────────────────────────────────────────── */
  .card {
    margin: 0 24px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
  }
  .card-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 0 0 10px;
  }
  .route-row {
    display: flex;
    gap: 12px;
    margin-bottom: 10px;
  }
  .route-row:last-child { margin-bottom: 0; }
  .route-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
  }
  .route-icon.pickup { background: var(--primary); }
  .route-icon.drop { background: var(--text-primary); }
  .route-text { font-size: 14px; line-height: 1.4; }
  .route-text .tag {
    display: block;
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 2px;
  }

  .driver-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .driver-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600;
    font-size: 16px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .driver-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .driver-name { font-weight: 600; font-size: 15px; }
  .driver-vehicle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

  /* ── States ─────────────────────────────────────────── */
  .center-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px;
  }
  .center-state h2 { font-size: 18px; margin: 0 0 8px; }
  .center-state p { font-size: 14px; color: var(--text-secondary); margin: 0; }

  .footer-tick {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-secondary);
    padding: 8px 24px 28px;
  }
  .delivered-banner {
    margin: 0 24px 16px;
    background: var(--success-soft);
    border: 1px solid #BBE8C8;
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    color: var(--success);
    font-size: 14px;
  }

  #app { display: none; flex-direction: column; flex: 1; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand-bar">
    <div class="brand-mark">P</div>
    <div class="brand-name">Pickar</div>
  </div>

  <div id="loading" class="center-state">
    <h2>Loading your delivery…</h2>
    <p>Hang tight, this only takes a second.</p>
  </div>

  <div id="notfound" class="center-state" style="display:none;">
    <h2>We can't find this delivery</h2>
    <p>This tracking link may have expired or been typed incorrectly.</p>
  </div>

  <div id="app">
    <div class="hero">
      <p class="eyebrow" id="eyebrow">Delivery status</p>
      <h1 class="status-headline" id="headline">—</h1>
      <p class="status-sub" id="subline"></p>
    </div>

    <div id="deliveredBanner" class="delivered-banner" style="display:none;">
      ✓ Delivered — thanks for using Pickar
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="card">
      <p class="card-label">Route</p>
      <div class="route-row">
        <span class="route-icon pickup"></span>
        <span class="route-text"><span class="tag">Pickup</span><span id="pickupLabel">—</span></span>
      </div>
      <div class="route-row">
        <span class="route-icon drop"></span>
        <span class="route-text"><span class="tag">Destination</span><span id="destLabel">—</span></span>
      </div>
    </div>

    <div class="card" id="driverCard" style="display:none;">
      <p class="card-label">Your driver</p>
      <div class="driver-row">
        <div class="driver-avatar" id="driverAvatar">?</div>
        <div>
          <div class="driver-name" id="driverName">—</div>
          <div class="driver-vehicle" id="driverVehicle">—</div>
        </div>
      </div>
    </div>

    <div class="footer-tick" id="tick">Updated just now</div>
  </div>
</div>

<script>
  const STAGES = [
    { key: 'placed',   label: 'Order placed',    match: ['pending', 'pending_payment', 'finding_driver', 'driver_assigned', 'driver_arrived', 'picked_up', 'in_transit', 'delivered'] },
    { key: 'assigned',  label: 'Driver assigned', match: ['driver_assigned', 'driver_arrived', 'picked_up', 'in_transit', 'delivered'] },
    { key: 'picked_up', label: 'Package picked up', match: ['picked_up', 'in_transit', 'delivered'] },
    { key: 'delivered', label: 'Delivered',       match: ['delivered'] },
  ];

  const HEADLINES = {
    pending: 'Getting your order ready',
    pending_payment: 'Awaiting confirmation',
    finding_driver: 'Finding you a driver',
    driver_assigned: 'Driver is on the way',
    driver_arrived: 'Driver has arrived for pickup',
    picked_up: 'Package picked up',
    in_transit: 'On the way to destination',
    delivered: 'Delivered',
    cancelled: 'Delivery cancelled',
  };

  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const API_BASE = window.location.origin;

  let pollTimer = null;

  function renderTimeline(status) {
    const el = document.getElementById('timeline');
    el.innerHTML = '';

    let activeIndex = STAGES.findIndex(s => !s.match.includes(status));
    if (activeIndex === -1) activeIndex = STAGES.length; // all done (delivered)

    STAGES.forEach((stage, i) => {
      const isDone = i < activeIndex;
      const isActive = i === activeIndex && status !== 'delivered';
      const div = document.createElement('div');
      div.className = 'stage' + (isDone || (status === 'delivered') ? ' done' : '') + (isActive ? ' active' : '');
      div.innerHTML = `
        <div class="stage-rail"></div>
        <div class="stage-dot"></div>
        <div class="stage-label">${stage.label}</div>
      `;
      el.appendChild(div);
    });
  }

  function render(data) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    document.getElementById('headline').textContent = HEADLINES[data.status] || 'Tracking your delivery';
    document.getElementById('subline').textContent =
      data.status === 'delivered'
        ? 'Your package has arrived safely.'
        : data.recipientName ? `To ${data.recipientName}` : '';

    document.getElementById('pickupLabel').textContent = data.pickupLabel || 'Pickup location';
    document.getElementById('destLabel').textContent = data.destinationLabel || 'Destination';

    renderTimeline(data.status);

    if (data.driver) {
      document.getElementById('driverCard').style.display = 'block';
      document.getElementById('driverName').textContent = data.driver.name || 'Your driver';
      const vehicle = data.driver.vehicle
        ? [data.driver.vehicle.model, data.driver.vehicle.plateNumber].filter(Boolean).join(' · ')
        : '';
      document.getElementById('driverVehicle').textContent = vehicle;
      const avatarEl = document.getElementById('driverAvatar');
      if (data.driver.photo) {
        avatarEl.innerHTML = `<img src="${data.driver.photo}" alt="">`;
      } else {
        avatarEl.textContent = (data.driver.name || '?').charAt(0).toUpperCase();
      }
    }

    document.getElementById('deliveredBanner').style.display =
      data.status === 'delivered' ? 'flex' : 'none';

    document.getElementById('tick').textContent = 'Updated just now';

    if (data.status === 'delivered' || data.status === 'cancelled') {
      clearInterval(pollTimer);
    }
  }

  async function fetchStatus() {
    try {
      const res = await fetch(`${API_BASE}/api/track/${token}`);
      const json = await res.json();

      if (!json.success) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('notfound').style.display = 'flex';
        clearInterval(pollTimer);
        return;
      }

      render(json.data);
    } catch (err) {
      console.error('Tracking fetch failed', err);
    }
  }

  if (!token) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('notfound').style.display = 'flex';
  } else {
    fetchStatus();
    pollTimer = setInterval(fetchStatus, 5000);
  }
</script>

</body>
</html>
